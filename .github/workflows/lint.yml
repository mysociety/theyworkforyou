name: Lint

on: [push]

jobs:
  test:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: setup ruff
      run: pip install ruff

    - name: check ruff linter
      run: ruff check --output-format=github .

    - name: check ruff formatter
      run: ruff format --check .

    - name: Restore php-cs-fixer
      id: cache-php-cs-fixer
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .php-cs-fixer.cache
          tools/php-cs-fixer
        key: ${{ runner.OS }}-${{ github.repository }}-phpcsfixer82

    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: 8.2

    - name: Install PHP-CS-Fixer
      if: steps.cache-php-cs-fixer.outputs.cache-hit != 'true'
      run: |
        php composer.phar install --working-dir=tools/php-cs-fixer

    - name: Run PHP-CS-Fixer
      run: |
        tools/php-cs-fixer/vendor/bin/php-cs-fixer --diff check

    - name: Save php-cs-fixer
      id: save-php-cs-fixer
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .php-cs-fixer.cache
          tools/php-cs-fixer
        key: ${{ runner.OS }}-${{ github.repository }}-phpcsfixer82
